<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Package | TravelEase</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f6f8fc;
            color: #17213a;
        }

        nav {
            height: 80px;
            background: #101827;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .logo {
            font-size: 27px;
            font-weight: 800;
            color: white;
        }

        .logo span {
            color: #35d4b5;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 30px;
            font-weight: 600;
        }

        .container {
            width: 86%;
            max-width: 1050px;
            margin: 55px auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 35px;
            border: 1px solid #e1e6ee;
            box-shadow: 0 12px 35px rgba(20, 30, 50, 0.07);
        }

        .tag {
            color: #11b89b;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        h2 {
            margin-bottom: 25px;
        }

        .package-name {
            font-size: 25px;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .description {
            color: #68748b;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .price {
            font-size: 30px;
            font-weight: 800;
            color: #11b89b;
        }

        .duration {
            color: #68748b;
            margin-top: 8px;
        }

        label {
            display: block;
            margin: 17px 0 7px;
            font-weight: 700;
        }

        input,
        select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d5dce7;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #35d4b5;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #35d4b5;
            color: #07131d;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            color: #11b89b;
            text-decoration: none;
            font-weight: 700;
        }

        @media (max-width: 750px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">Travel<span>Ease</span></div>

    <div>
        <a href="/">Home</a>
        <a href="/#packages">Packages</a>
    </div>
</nav>

<div class="container">

    <div class="card">

        <div class="tag">TRAVEL PACKAGE</div>

        <h1>Book Your Trip</h1>

        <div class="package-name">
            {{ package.package_name }}
        </div>

        <p class="description">
            {{ package.description }}
        </p>

        <div class="price">
            ₹{{ "{:,.0f}".format(package.base_price) }}
        </div>

        <div class="duration">
            {{ package.duration_days }} Days ·
            Maximum {{ package.max_travelers }} Travelers
        </div>

        <a class="back" href="/package/{{ package.package_id }}">
            ← Back to Package
        </a>

    </div>


    <div class="card">

        <h2>Traveler Details</h2>

        <form method="POST"
              action="/book/{{ package.package_id }}">

            <label for="full_name">Full Name</label>
            <input
                type="text"
                id="full_name"
                name="full_name"
                placeholder="Enter your full name"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                required
            >

            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <label for="date_of_birth">Date of Birth</label>
            <input
                type="date"
                id="date_of_birth"
                name="date_of_birth"
                required
            >

            <label for="travel_date">Travel Date</label>
            <input
                type="date"
                id="travel_date"
                name="travel_date"
                required
            >

            <label for="number_of_travelers">
                Number of Travelers
            </label>

            <input
                type="number"
                id="number_of_travelers"
                name="number_of_travelers"
                min="1"
                max="{{ package.max_travelers }}"
                value="1"
                required
            >

            <button type="submit">
                Confirm Booking
            </button>

        </form>

    </div>

</div>

</body>
</html>
